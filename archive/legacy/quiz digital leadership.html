<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بنك أسئلة — القيادة الرقمية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;500;700&display=swap');
:root{
  --navy:#0f1c3f;--blue:#2563eb;--sky:#38bdf8;--gold:#f59e0b;
  --green:#10b981;--red:#ef4444;--surface:#f1f5ff;--card:#fff;
  --border:#dde6ff;--muted:#6b7a99;--shadow:0 4px 24px rgba(37,99,235,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Tajawal',sans-serif;background:linear-gradient(135deg,#e8eeff 0%,#f0f9ff 50%,#fef9ee 100%);min-height:100vh;color:var(--navy)}

/* HERO */
.hero{background:linear-gradient(135deg,#0f1c3f 0%,#1e3a8a 60%,#0f3460 100%);color:#fff;padding:44px 20px 32px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 35%,rgba(56,189,248,.15),transparent 55%),radial-gradient(ellipse at 20% 75%,rgba(245,158,11,.1),transparent 50%)}
.badge{display:inline-block;background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.35);color:#7dd3fc;border-radius:50px;padding:5px 18px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:14px}
.hero h1{font-size:clamp(20px,4.5vw,34px);font-weight:900;position:relative}
.hero h1 span{color:var(--gold)}
.hero p{color:rgba(255,255,255,.6);font-size:14px;margin-top:8px;position:relative}

/* TABS */
.tabs-bar{background:#fff;border-bottom:2px solid var(--border);display:flex;overflow-x:auto;padding:0 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.06);gap:2px;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:none;border:none;border-bottom:3px solid transparent;padding:14px 14px 11px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--muted);transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-btn:hover:not(.active){color:var(--navy)}

/* CONTENT */
.content{max-width:900px;margin:0 auto;padding:28px 14px 60px}
.section-panel{display:none}
.section-panel.active{display:block}

.sec-head{margin-bottom:26px}
.sec-title{font-size:20px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sec-sub{color:var(--muted);font-size:13px;padding-right:48px}

/* SCORE BAR */
.score-bar{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:24px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.score-info{font-size:14px;font-weight:700;color:var(--navy)}
.score-info span{color:var(--blue)}
.score-pill{background:linear-gradient(135deg,var(--blue),#6366f1);color:#fff;border-radius:50px;padding:7px 18px;font-size:13px;font-weight:700}
.reset-btn{background:linear-gradient(135deg,var(--blue),#6366f1);color:#fff;border:none;border-radius:9px;padding:8px 20px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.reset-btn:hover{opacity:.87;transform:translateY(-1px)}

/* QUESTION CARD */
.q-card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:18px;border:1.5px solid var(--border);box-shadow:var(--shadow);transition:border-color .3s}
.q-card.answered-correct{border-color:var(--green);background:#f0fff9}
.q-card.answered-wrong{border-color:var(--red);background:#fff5f5}
.q-num{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--blue);margin-bottom:8px}
.q-text{font-size:15px;font-weight:700;line-height:1.75;color:var(--navy);margin-bottom:16px}

/* MCQ */
.options{display:flex;flex-direction:column;gap:9px}
.option-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;text-align:right;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:500;color:var(--navy);transition:all .2s;display:flex;align-items:center;gap:9px}
.option-btn:hover:not(:disabled){border-color:var(--blue);background:#eef3ff;transform:translateX(-3px)}
.option-btn:disabled{cursor:default}
.option-btn.correct{background:#e6fff5;border-color:var(--green);color:#065f46;font-weight:700}
.option-btn.wrong{background:#fff0f0;border-color:var(--red);color:#991b1b;font-weight:700}
.option-btn.reveal-correct{background:#e6fff5;border-color:var(--green);color:#065f46}
.opt-letter{width:26px;height:26px;border-radius:7px;background:#fff;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}

/* T/F */
.tf-options{display:flex;gap:10px}
.tf-btn{flex:1;border:2px solid var(--border);border-radius:11px;padding:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;transition:all .2s;text-align:center}
.tf-btn.true-btn{background:#f0fff9;color:#065f46}
.tf-btn.false-btn{background:#fff5f5;color:#991b1b}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.09)}
.tf-btn:disabled{cursor:default;opacity:.87}
.tf-btn.sel-correct{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.tf-btn.sel-wrong{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.tf-btn.reveal{border-color:var(--green)}

/* FEEDBACK */
.feedback{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:13.5px;font-weight:600;display:none;animation:fadeIn .3s}
.feedback.show{display:flex;align-items:flex-start;gap:7px}
.feedback.correct{background:#e6fff5;color:#065f46;border:1px solid #a7f3d0}
.feedback.wrong{background:#fff0f0;color:#991b1b;border:1px solid #fecaca}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:580px){.q-text{font-size:14px}.option-btn{font-size:13px;padding:10px 12px}}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">📘 تقرير أكاديمي شامل — القيادة الرقمية</div>
  <h1>بنك أسئلة <span>القيادة الرقمية</span></h1>
  <p>إعداد: حميد زكي حميد — الشعبة ب &nbsp;|&nbsp; 7 محاضرات — 210 سؤالاً</p>
</div>

<div class="tabs-bar">
  <button class="tab-btn active"  onclick="showTab('t1')">م١: مدخل ومفاهيم</button>
  <button class="tab-btn"         onclick="showTab('t2')">م٢: التفكير الاستراتيجي</button>
  <button class="tab-btn"         onclick="showTab('t3')">م٣: الابتكار والثقافة</button>
  <button class="tab-btn"         onclick="showTab('t4')">م٤: الحوكمة والمخاطر</button>
  <button class="tab-btn"         onclick="showTab('t5')">م٥: القرار والبيانات</button>
  <button class="tab-btn"         onclick="showTab('t6')">م٦: إدارة المشاريع Agile</button>
  <button class="tab-btn"         onclick="showTab('t7')">م٧: القطاع العام والتنمية</button>
</div>

<div class="content">
<!-- panels injected by JS -->
<div id="t1" class="section-panel active"></div>
<div id="t2" class="section-panel"></div>
<div id="t3" class="section-panel"></div>
<div id="t4" class="section-panel"></div>
<div id="t5" class="section-panel"></div>
<div id="t6" class="section-panel"></div>
<div id="t7" class="section-panel"></div>
</div>

<script>
// ─────────────────────────────────────────────
// QUESTION DATA  (30 per tab = 20 MCQ + 10 T/F)
// ─────────────────────────────────────────────
const DATA = {

/* ══════════════════════════════════════════════
   محاضرة 1 — مدخل إلى القيادة الرقمية
══════════════════════════════════════════════ */
t1:[
{type:'mcq',q:'ما التعريف الأدق للقيادة الرقمية وفقاً للتقرير؟',
 opts:['إتقان أدوات التكنولوجيا الحديثة فقط','التعبئة الاستراتيجية للموارد والعمليات القيادية لاستخدام التكنولوجيا بهدف تحقيق أهداف المنظمة في بيئة متغيرة','إدارة الفرق عن بُعد عبر الإنترنت','تحويل الوثائق الورقية إلى صيغة إلكترونية'],
 ans:1,exp:'القيادة الرقمية تتجاوز الأدوات لتشمل إعادة تصور كامل لخلق القيمة وتقديمها.'},

{type:'mcq',q:'ما المستويات الثلاثة للتحول الرقمي كما يُميّزها الباحثون؟',
 opts:['التخطيط والتنفيذ والتقييم','الأتمتة والرقمنة والتحول الرقمي الحقيقي','التقنية والبشرية والمالية','المحلية والإقليمية والدولية'],
 ans:1,exp:'الأتمتة تستبدل العمليات اليدوية، الرقمنة تحوّل المعلومات، والتحول الحقيقي يعيد هيكلة نموذج الأعمال بأكمله.'},

{type:'mcq',q:'ما مصدر القوة الرئيسي في القيادة الرقمية مقارنةً بالقيادة التقليدية؟',
 opts:['السلطة الهرمية','الخبرة الشخصية فقط','البيانات والمعرفة الرقمية','العلاقات الشخصية'],
 ans:2,exp:'جدول المقارنة يُبيّن أن القيادة الرقمية تعتمد البيانات والمعرفة الرقمية بدلاً من السلطة الهرمية.'},

{type:'mcq',q:'ما التعامل الصحيح مع الفشل وفقاً لمنهج القيادة الرقمية؟',
 opts:['تجنب الفشل بأي ثمن','معاقبة كل أخطاء الموظفين','الفشل السريع والتعلم المبكر','إخفاء الأخطاء لحماية سمعة المنظمة'],
 ans:2,exp:'القيادة الرقمية تؤمن بأن الفشل السريع والتعلم المبكر أرخص بكثير من الاكتشاف المتأخر.'},

{type:'mcq',q:'ما الخاصية التي تُميّز القائد الرقمي في إدارة الفرق الموزعة جغرافياً؟',
 opts:['القدرة البرمجية العالية','الذكاء العاطفي الرقمي (Digital EQ)','السيطرة الهرمية على الفرق','اعتماد الاجتماعات الحضورية'],
 ans:1,exp:'الذكاء العاطفي الرقمي يُمكّن القائد من إدارة الفرق الافتراضية مع الحفاظ على التواصل والانتماء.'},

{type:'mcq',q:'ما الدرس الجوهري الذي يقدمه نموذج Netflix في القيادة الرقمية؟',
 opts:['ضرورة الاستثمار في الأفلام الوثائقية','الرشاقة الاستراتيجية: تجاوز النماذج الناجحة طوعاً قبل أن يُجبرك المنافسون','أهمية التوسع الجغرافي السريع','بناء شبكة توزيع فيزيائية واسعة'],
 ans:1,exp:'ريد هاستينغز تخلى عن نموذج DVD المربح طوعاً عام 2007 وانتقل للبث المباشر — هذه هي جوهر الرشاقة الاستراتيجية.'},

{type:'mcq',q:'ما القرار الجريء الذي اتخذه Netflix عام 2011؟',
 opts:['الاندماج مع Blockbuster','الانتقال إلى إنتاج المحتوى الأصلي مُخاطراً بمليارات الدولارات','فتح فروع في آسيا','تقليص أسعار الاشتراك'],
 ans:2,exp:'إنتاج House of Cards وOrange Is the New Black غيّر قواعد صناعة الترفيه بأكملها.'},

{type:'mcq',q:'ما التحدي الأكبر للتحول الرقمي في العراق وفقاً للتقرير؟',
 opts:['غياب الشباب المتعلم','التحدي القيادي: تحويل الإرادة السياسية إلى استراتيجيات رقمية قابلة للقياس والتنفيذ','ارتفاع تكاليف التكنولوجيا','انعدام مواقع الإنترنت'],
 ans:1,exp:'التقرير يُشير إلى أن ثمة شريحة شبابية وتشريعات ناشئة، لكن التحدي الأكبر قيادي في جوهره.'},

{type:'mcq',q:'كيف تُعرّف القيادة الرقمية علاقتها بالتكنولوجيا مقارنةً بالقيادة التقليدية؟',
 opts:['التكنولوجيا عبء تنظيمي يُحدّ منه','التكنولوجيا كأداة مساعدة فقط','التكنولوجيا كمحرك استراتيجي يُعيد هيكلة خلق القيمة','التكنولوجيا اختياريه غير ملزمة'],
 ans:2,exp:'القيادة الرقمية ترى التكنولوجيا محركاً استراتيجياً لا أداة مساعدة فحسب.'},

{type:'mcq',q:'ما إحدى أبرز خصائص القائد الرقمي المتعلقة بهجر النماذج القديمة؟',

 ans:1,exp:'القائد الرقمي يمتلك الشجاعة على هجر النماذج الناجحة لصالح نماذج جديدة قد تكون أفضل.'},

{type:'mcq',q:'ما نطاق الرؤية الزمنية في القيادة الرقمية مقارنةً بالتقليدية؟',
 opts:['أقصر: التركيز على الربع السنوي فقط','المدى القصير والمتوسط كالقيادة التقليدية','التكيّف المستمر في الزمن الفعلي بدلاً من المدى القصير والمتوسط','المدى البعيد جداً: خمسون عاماً فأكثر'],
 ans:2,exp:'جدول المقارنة يُوضح أن القيادة الرقمية تعتمد التكيف المستمر في الزمن الفعلي.'},

{type:'mcq',q:'ما الجانب الإيجابي الذي يذكره التقرير في السياق العراقي رغم التحديات؟',
 opts:['امتلاك بنية رقمية متكاملة','شريحة شبابية كبيرة ومتعطشة للتعلم وبنية تشريعية بدأت تتحرك','تميّز القطاع العام بالكفاءة الرقمية','اكتفاء ذاتي في مجال الاتصالات'],
 ans:1,exp:'التقرير يُشير تحديداً إلى هاتين الإشارتين الإيجابيتين رغم التحديات التقنية والبشرية.'},

{type:'mcq',q:'ما الفرق بين القيادة التقليدية والرقمية في الثقافة التنظيمية؟',
 opts:['لا فرق جوهري بينهما','التقليدية تُشجع الابتكار أكثر','القيادة الرقمية تُرسّخ ثقافة المرونة والابتكار المستمر بدلاً من الاستقرار والسيطرة','القيادة الرقمية أكثر تسلطاً'],
 ans:2,exp:'الجدول يُبيّن: التقليدية = الاستقرار والسيطرة، الرقمية = المرونة والابتكار المستمر.'},

{type:'mcq',q:'ما مفهوم القائد في القيادة الرقمية وفقاً للمقدمة العامة؟',
 opts:['مدير يأمر وينهى','موجّه يُمكّن ويُلهم ويُشارك','مراقب يُراجع التقارير','متخصص تقني يحل المشكلات'],
 ans:1,exp:'المقدمة تُعيد تعريف القائد الرقمي من "مدير يأمر" إلى "موجّه يُمكّن ويُلهم ويُشارك".'},

{type:'mcq',q:'ما الدليل الذي تقدمه جائحة كوفيد-19 على أهمية القيادة الرقمية؟',
 opts:['أثبتت أن التكنولوجيا غير ضرورية','كشفت أن المنظمات ذات القادة الرقميين صمدت ونمت بينما انهارت المنظمات التقليدية','أثبتت أن المنظمات الكبيرة تنجو دائماً','أظهرت أهمية التوسع الجغرافي'],
 ans:1,exp:'التقرير يستخدم جائحة كوفيد-19 دليلاً قاطعاً على الأهمية الحيوية للقيادة الرقمية.'},

{type:'mcq',q:'ما الخاصية التي تجعل البيانات "النفط الجديد" بل أشد تأثيراً منه؟',
 opts:['البيانات تنضب بسرعة كالنفط','النفط يُستهلك بالاستخدام، بينما البيانات تتضاعف قيمتها كلما زاد استخدامها','البيانات أسهل في الاستخراج','البيانات متاحة للجميع بالتساوي'],

{type:'mcq',q:'ما أسلوب القرار الذي تعتمده القيادة الرقمية؟',

 ans:2,exp:'جدول المقارنة يُحدد: القيادة الرقمية تعتمد التحليلات والذكاء الاصطناعي.'},

{type:'mcq',q:'ما الخصائص الجوهرية الست المذكورة للقائد الرقمي في التقرير؟',
 opts:['التقنية، الذكاء، السرعة، الشجاعة، الخبرة، الحزم','الرؤية الاستراتيجية، الرشاقة التنظيمية، الشجاعة، الذكاء العاطفي الرقمي، الثقافة التعلمية، الشفافية والمساءلة','البرمجة، قواعد البيانات، الشبكات، الأمن، السحابة، الذكاء الاصطناعي','التخطيط، التنظيم، التوجيه، الرقابة، التنسيق، التقييم'],
 ans:1,exp:'التقرير يُحدد ستاً: الرؤية، الرشاقة، الشجاعة، الذكاء العاطفي الرقمي، الثقافة التعلمية، الشفافية.'},

{type:'mcq',q:'ما الذي اختفى تقريباً من سوق تأجير الأفلام بسبب الرشاقة الاستراتيجية لـ Netflix؟',
 opts:['Amazon','Blockbuster','Disney','Hulu'],
 ans:1,exp:'شركة Blockbuster التي كانت تسيطر بآلاف الفروع اختفت تقريباً بينما بلغ Netflix 260 مليون مشترك.'},

{type:'mcq',q:'ما إحدى أهم صفات "الثقافة التعلمية" عند القائد الرقمي؟',

 ans:1,exp:'القائد الرقمي يُعزز الفضول ويتعلم من الإخفاقات بنفس القدر الذي يتعلم من النجاحات.'},

// T/F ×10

  const panel=document.getElementById(tabId);
  panel.innerHTML=`

      <div class="sec-title"><div class="sec-icon" style="background:${meta.bg}">${meta.icon}</div>${meta.title}</div>
      <div class="sec-sub">30 سؤالاً — 20 اختيار من متعدد + 10 صح/خطأ</div>

      <div style="display:flex;gap:9px;align-items:center">
        <div class="score-pill" id="${tabId}-pct">0%</div>

      </div>
    </div>
    <div id="${tabId}-qs"></div>

function renderQuestions(tabId){
  const qs=DATA[tabId];
  const container=document.getElementById(tabId+'-qs');
  container.innerHTML='';
  scores[tabId]={c:0,t:0};
  updateScore(tabId);
  qs.forEach((q,i)=>container.appendChild(buildCard(tabId,q,i)));
}

function buildCard(tabId,q,i){
  const card=document.createElement('div');
  card.className='q-card';
  card.id=`${tabId}-qc${i}`;
  const typeLabel=q.type==='mcq'?'🔵 اختيار من متعدد':'✅ صح أم خطأ';
  let body=`<div class="q-num">${typeLabel} — سؤال ${i+1}</div><div class="q-text">${i+1}. ${q.q}</div>`;
  if(q.type==='mcq'){
    const ltrs=['أ','ب','ج','د'];
    body+=`<div class="options">`;
    q.opts.forEach((o,oi)=>{
      body+=`<button class="option-btn" id="${tabId}-q${i}o${oi}" onclick="answerMCQ('${tabId}',${i},${oi})">
               <span class="opt-letter">${ltrs[oi]}</span>${o}</button>`;
    });
    body+=`</div>`;
  } else {
    body+=`<div class="tf-options">
      <button class="tf-btn true-btn" id="${tabId}-q${i}t" onclick="answerTF('${tabId}',${i},true)">✔ صح</button>
      <button class="tf-btn false-btn" id="${tabId}-q${i}f" onclick="answerTF('${tabId}',${i},false)">✘ خطأ</button>
    </div>`;
  }
  body+=`<div class="feedback" id="${tabId}-q${i}fb"></div>`;
  card.innerHTML=body;
  return card;
}

function answerMCQ(tabId,i,chosen){
  const q=DATA[tabId][i];
  q.opts.forEach((_,oi)=>{
    const btn=document.getElementById(`${tabId}-q${i}o${oi}`);
    btn.disabled=true;
    if(oi===q.ans) btn.classList.add(chosen===q.ans?'correct':'reveal-correct');
    if(oi===chosen&&chosen!==q.ans) btn.classList.add('wrong');
  });
  markScore(tabId,i,chosen===q.ans,q.exp);
}

function answerTF(tabId,i,chosen){
  const q=DATA[tabId][i];
  const tb=document.getElementById(`${tabId}-q${i}t`);
  const fb=document.getElementById(`${tabId}-q${i}f`);
  tb.disabled=true; fb.disabled=true;
  const ok=chosen===q.ans;
  const chosenBtn=chosen?tb:fb;
  const correctBtn=q.ans?tb:fb;
  chosenBtn.classList.add(ok?'sel-correct':'sel-wrong');
  if(!ok) correctBtn.classList.add('reveal');
  markScore(tabId,i,ok,q.exp);
}

function markScore(tabId,i,ok,exp){
  scores[tabId].t++;
  if(ok) scores[tabId].c++;
  updateScore(tabId);
  const fb=document.getElementById(`${tabId}-q${i}fb`);
  fb.className='feedback show '+(ok?'correct':'wrong');
  fb.innerHTML=(ok?'✅ <span>إجابة صحيحة!</span> ':'❌ <span>إجابة خاطئة.</span> ')+exp;
  document.getElementById(`${tabId}-qc${i}`).classList.add(ok?'answered-correct':'answered-wrong');
}

function updateScore(tabId){
  const s=scores[tabId];
  document.getElementById(tabId+'-c').textContent=s.c;
  document.getElementById(tabId+'-t').textContent=s.t;
  const pct=s.t>0?Math.round(s.c/s.t*100):0;
  document.getElementById(tabId+'-pct').textContent=pct+'%';
}

function showTab(tabId){
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  tabIds.indexOf(tabId);
  document.querySelectorAll('.tab-btn')[tabIds.indexOf(tabId)].classList.add('active');
}

function resetTab(tabId){renderQuestions(tabId);}

// INIT
tabIds.forEach((id,idx)=>{buildPanel(id,tabMeta[idx]);renderQuestions(id);});
</script>
</body>
</html>

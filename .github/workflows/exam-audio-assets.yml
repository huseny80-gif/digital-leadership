name: Study pages and lecture audio assets
on:
  push:
    paths:
      - "exam-module.html"
      - "summaries.html"
      - "assets/audio/**"
      - "assets/study-module-loader.js"
      - "shared/src/studyCourses.ts"
      - "backend/content/finquiz/catalog.json"
      - "backend/content/finquiz/academicSummaries.json"
      - "exam-section/**"
      - "scripts/*exam*audio*"
      - "scripts/*lecture*audio*"
      - "scripts/*subject*audio*"
      - "web/public/exam-module.html"
      - "web/public/summaries.html"
      - "web/public/assets/audio/**"
      - "web/public/assets/study-module-loader.js"
      - "web/public/exam-section/**"
      - ".github/workflows/exam-audio-assets.yml"
  pull_request:
    paths:
      - "exam-module.html"
      - "summaries.html"
      - "assets/audio/**"
      - "assets/study-module-loader.js"
      - "shared/src/studyCourses.ts"
      - "backend/content/finquiz/catalog.json"
      - "backend/content/finquiz/academicSummaries.json"
      - "exam-section/**"
      - "scripts/*exam*audio*"
      - "scripts/*lecture*audio*"
      - "scripts/*subject*audio*"
      - "web/public/exam-module.html"
      - "web/public/summaries.html"
      - "web/public/assets/audio/**"
      - "web/public/assets/study-module-loader.js"
      - "web/public/exam-section/**"
      - ".github/workflows/exam-audio-assets.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test asset synchronization
        run: node --test scripts/sync-exam-audio.test.mjs
      - name: Test source-bound recording inventory preservation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare-all-subject-audio.test.py
      - name: Verify all published subjects match approved catalog summaries
        run: python3 scripts/prepare-all-subject-audio.py --check
      - name: Verify published assets match canonical sources
        run: node scripts/sync-exam-audio.mjs --check
      - name: Check audio-tool syntax without generating bytecode
        run: python3 -c "import ast, pathlib; [ast.parse(path.read_text()) for path in pathlib.Path('scripts').glob('*audio*.py')]"
      - name: Test lecture production safety without provider calls
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/produce-lecture-audio.test.py

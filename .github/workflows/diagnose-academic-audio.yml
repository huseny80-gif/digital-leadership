name: Diagnose academic audio
on:
  push:
    branches: ["codex/diagnose-podcast-transport"]
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node backend/scripts/diagnoseAcademicSpeech.mjs

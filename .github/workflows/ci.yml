name: CI

# Phase 5.1 — this is the platform's first automated CI pipeline. Every
# prior "typecheck clean / N tests passing" claim in this project's history
# was verified manually by a developer or agent, with no automated gate
# catching a regression before merge. Runs on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (web's test environment) requires Node ^22.22.2 —
          # Node 20 fails at test time with "webidl.util.markAsUncloneable
          # is not a function". Backend has no such constraint but is kept
          # on the same major for consistency.
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build shared package
        working-directory: shared
        run: npx tsc -p tsconfig.json
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/digital_leadership_backend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build shared package
        working-directory: shared
        run: npx tsc -p tsconfig.json
      - name: Typecheck
        run: npm run typecheck
      # Informational only: 4 pre-existing no-unused-vars errors in test
      # fixtures predate this pipeline (see PHASE5_1_CI_MONITORING_REPORT.md)
      # — not gating CI on them, but still surfaced in the job log.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database digital_leadership_backend_test;"
      - name: Apply migrations (safe order — see supabase/MIGRATION_ORDER.md)
        working-directory: supabase
        run: |
          PGPASSWORD=postgres
          export PGPASSWORD
          # Auth schema + auth.uid() + roles must exist before migration 11
          # (RLS policies) can even be CREATEd — see local_verification_shim.sql's
          # own header comment for why this file exists at all.
          psql -h localhost -U postgres -d digital_leadership_backend_test <<'SQL'
          create schema auth;
          create or replace function auth.uid() returns uuid as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$ language sql stable;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin bypassrls; end if;
          end
          $$;
          SQL
          for f in migrations/0000000000000*.sql migrations/00000000000010_*.sql migrations/00000000000011_*.sql \
                   migrations/00000000000014_complete_assessment_schema.sql \
                   migrations/00000000000012_quiz_attempt_answer_match_order.sql \
                   migrations/00000000000013_rubric_and_assignments.sql \
                   $(ls migrations/*.sql | grep -v -E '/000000000000(0[0-9]|1[0-4])_' | sort); do
            psql -h localhost -U postgres -d digital_leadership_backend_test -v ON_ERROR_STOP=1 -f "$f"
          done
          # Grants must run after every table exists (grant ... on all
          # tables in schema public only covers tables that exist yet).
          psql -h localhost -U postgres -d digital_leadership_backend_test <<'SQL'
          grant usage on schema public to anon, authenticated, service_role;
          grant usage on schema auth to anon, authenticated, service_role;
          grant select on all tables in schema public to anon;
          grant select, insert, update, delete on all tables in schema public to authenticated;
          grant all on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to authenticated, service_role;
          SQL
      # tests/integration/phase12iPostMigrationSecurity.test.ts is excluded
      # here, not modified: it requires the real migrated Finquiz dataset
      # (5 subjects, 187 questions) that only exists in production/a
      # manually-seeded local DB, per its own describe-block title
      # ("real migrated data, no data wiped") — a from-scratch CI database
      # legitimately has none of that content. This is a pre-existing,
      # already-documented gap (see PHASE5_1_CI_MONITORING_REPORT.md),
      # not something this pipeline should paper over by weakening the
      # test itself.
      - name: Test
        run: npx vitest run --exclude "tests/integration/phase12iPostMigrationSecurity.test.ts"
      - name: Production build
        run: npm run build

name: digital_leadership
description: >
  Digital Leadership educational platform — Flutter client for iOS and
  Android, sharing the same backend API as the web app (ARCHITECTURE.md
  §2.2). Scaffolding phase: navigation shell and module boundaries only,
  no business logic implemented yet.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

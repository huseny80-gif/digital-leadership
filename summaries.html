<!DOCTYPE html>
<html lang="ar" dir="rtl" data-summary-redirect>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-9q/9XH5Mj2Lm0ITjGRLDR/5nnEOOf+vPCoI87MPSKnI='; style-src 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>ملخصات المادة والبودكاست — القيادة الرقمية</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; min-height: 100vh; background: #052223; color: #f8fafc; font-family: Tahoma, sans-serif; line-height: 1.9; }
    main { max-width: 640px; margin: 48px auto; padding: 24px; background: #0b3b3c; border: 1px solid #d4af37; border-radius: 20px; }
    h1 { color: #f3e5ab; font-size: 24px; line-height: 1.6; }
    p { margin-block: 16px; }
    a { display: block; min-height: 44px; padding: 12px 16px; color: #052223; background: #d4af37; border-radius: 12px; text-align: center; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f3e5ab; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>الملخصات والبودكاست</h1>
    <p id="redirect-status" role="status">أصبحت الملخصات والبودكاست ضمن صفحة كل مادة. افتح مادتك الدراسية ثم تبويب «الملخصات والبودكاست».</p>
    <a id="platform-link" class="platform-link" href="https://web-husen4.vercel.app/subjects">فتح المواد الدراسية</a>
    <noscript><p>افتح المواد الدراسية للوصول إلى ملخصات مادتك وبودكاست محاضراتها.</p></noscript>
  </main>
  <script id="summaries-script">"use strict";
(() => {
  const platform = "https://web-husen4.vercel.app";
  const params = new URLSearchParams(location.search);
  const subject = params.get("subject");
  const valid = params.getAll("subject").length === 1 && /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(subject || "");
  const destination = valid ? platform + "/subjects/" + encodeURIComponent(subject) + "/summaries" : platform + "/subjects";
  const link = document.getElementById("platform-link");
  link.href = destination;
  if (valid) {
    link.textContent = "فتح ملخصات هذه المادة";
    document.getElementById("redirect-status").textContent = "جارٍ فتح الملخصات والبودكاست داخل مادتك الدراسية…";
    const anchor = /^#[a-z][a-z0-9-]{0,79}$/.test(location.hash) ? location.hash : "";
    location.replace(destination + anchor);
  }
})();</script>
</body>
</html>
